apiVersion: 1
datasources:
  - name: InfluxDB
    uid: influxdb-aim
    type: influxdb
    access: proxy
    url: http://aim-influxdb:8086
    isDefault: true
    jsonData:
      version: Flux
      organization: aim-org
      defaultBucket: aim
      tlsSkipVerify: true
    secureJsonData:
      token: aim-super-secret-token-2026
